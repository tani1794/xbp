<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タニサンのページ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 24px;
      color: #222222;
      background-color: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
    }

    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 42px;
      text-align: center;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      line-height: 1.4;
      letter-spacing: 0.08em;
    }

    .video-list {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
    }

    .video-item {
      width: 100%;
      max-width: 330px;
    }

    .video-item h2 {
      margin: 0 0 16px;
      text-align: center;
      font-size: 1.15rem;
      line-height: 1.5;
      letter-spacing: 0.04em;
    }

    .video-frame {
      width: 100%;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 16px;
      background-color: #111111;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .video-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 720px) {
      body {
        padding: 36px 18px;
      }

      h1 {
        margin-bottom: 32px;
      }

      .video-list {
        flex-direction: column;
        align-items: center;
        gap: 36px;
      }

      .video-item {
        max-width: 360px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>最終課題　動画</h1>

    <div class="video-list">
      <section class="video-item" aria-labelledby="video-title-1">
        <h2 id="video-title-1">最終課題　動画1</h2>

        <div class="video-frame">
          <iframe
            src="https://www.youtube.com/embed/1eLGIdQPPL4"
            title="最終課題 動画1"
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </div>
      </section>

      <section class="video-item" aria-labelledby="video-title-2">
        <h2 id="video-title-2">最終課題　動画2</h2>

        <div class="video-frame">
          <iframe
            src="https://www.youtube.com/embed/iFIUFnJ3QPg"
            title="最終課題 動画2"
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen
          ></iframe>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
